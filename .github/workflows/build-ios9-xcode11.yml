name: Build iOS 9.3.5 with Xcode 11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-11

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Check macOS and Xcode version
      run: |
        sw_vers
        xcodebuild -version

    - name: List available Xcode versions
      run: |
        ls -la /Applications/ | grep Xcode || echo "No alternate Xcode versions"

    - name: Show available SDKs
      run: xcodebuild -showsdks

    - name: Check if we can select Xcode 11
      run: |
        if [ -d "/Applications/Xcode_11.7.app" ]; then
          sudo xcode-select -s /Applications/Xcode_11.7.app
          echo "Switched to Xcode 11.7"
        elif [ -d "/Applications/Xcode_11.app" ]; then
          sudo xcode-select -s /Applications/Xcode_11.app
          echo "Switched to Xcode 11"
        else
          echo "Using default Xcode"
        fi
        xcodebuild -version

    - name: Build HomeButler for iOS 9.3.5
      run: |
        set -x
        xcodebuild \
          -project HomeButler.xcodeproj \
          -scheme HomeButler \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          IPHONEOS_DEPLOYMENT_TARGET=9.3 \
          ARCHS="armv7 arm64" \
          VALID_ARCHS="armv7 armv7s arm64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
          build

    - name: Find built app
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HomeButler.app" -type d | head -n 1)
        echo "App path: $APP_PATH"
        ls -la "$APP_PATH" || echo "App not found"

    - name: Create IPA
      run: |
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "HomeButler.app" -type d | head -n 1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r HomeButler-iOS9.ipa Payload
          ls -lh HomeButler-iOS9.ipa
        else
          echo "Could not find app to package"
          exit 1
        fi

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: HomeButler-iOS9.3.5
        path: HomeButler-iOS9.ipa
