name: Check Available Runners

on:
  workflow_dispatch:

jobs:
  test-macos-latest:
    runs-on: macos-latest
    steps:
    - name: Check macos-latest
      run: |
        echo "=== macOS Latest ==="
        sw_vers
        xcodebuild -version
        xcodebuild -showsdks | grep iphoneos

  test-macos-13:
    runs-on: macos-13
    steps:
    - name: Check macos-13
      run: |
        echo "=== macOS 13 ==="
        sw_vers
        xcodebuild -version
        xcodebuild -showsdks | grep iphoneos

  test-macos-14:
    runs-on: macos-14
    steps:
    - name: Check macos-14
      run: |
        echo "=== macOS 14 ==="
        sw_vers
        xcodebuild -version
        xcodebuild -showsdks | grep iphoneos
